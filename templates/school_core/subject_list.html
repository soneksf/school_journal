{% extends "base.html" %}
{% block content %}
<h1>Предмети</h1>
<table>
  <thead><tr><th>Назва</th><th>Скорочення</th></tr></thead>
  <tbody>
    {% for s in subjects %}
      <tr><td>{{ s.name }}</td><td>{{ s.short_code }}</td></tr>
    {% empty %}<tr><td colspan="2">Предметів не створено</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
